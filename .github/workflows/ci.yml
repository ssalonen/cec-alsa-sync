name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  LIBCEC_VERSION: 8.1.6
  # Tag of the prebuilt libCEC release to fetch. The libcec crate links
  # dynamically (dylib=cec) with no static option, so this bundles libcec.so.
  LIBCEC_RELEASE_TAG: libcec-v8.1.6-202608-2

jobs:
  cross-check:
    name: Cross-check ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - arm-unknown-linux-gnueabi
          - armv7-unknown-linux-gnueabihf
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Compile all targets without linking hardware libraries
        run: cargo check --all-targets --target ${{ matrix.target }} --verbose

  test:
    name: Test with libCEC 8
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes libudev1 unzip
      - name: Fetch matching libCEC 8 shared library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$LIBCEC_RELEASE_TAG" \
            --repo ssalonen/libcec-static-builds \
            --pattern "libcec-v${LIBCEC_VERSION}-dynamic-x86_64-unknown-linux-gnu-release.zip" \
            --dir "$RUNNER_TEMP/libcec"
          unzip -q "$RUNNER_TEMP/libcec"/*.zip -d "$RUNNER_TEMP/libcec/unpacked"
          echo "LIBCEC_LIB_DIR=$(find "$RUNNER_TEMP/libcec/unpacked" -type f -name libcec.so -printf '%h\n' -quit)" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: LD_LIBRARY_PATH="$LIBCEC_LIB_DIR" cargo test --bin cec-alsa-sync --verbose

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
