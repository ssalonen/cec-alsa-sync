[build.env]
passthrough = [
    "SCCACHE_ERROR_LOG",
    "SCCACHE_LOG",
    "SCCACHE_AZURE_CONNECTION_STRING",
    "SCCACHE_AZURE_BLOB_CONTAINER",
    "SCCACHE_DIR",
    "MAJOR_VERSION",
    "SRC_PATH",
    "DEST_PATH",
    "RUST_BACKTRACE",
    "LIBCEC_VENDORED",
    "LIBCEC_NO_VENDOR",
    "LIBCEC_STATIC",
]
[build]
default-target = "armv7-unknown-linux-gnueabihf"
pre-build = [
    # libcec links against libudev for device detection. It has to be the copy for
    # the *target* architecture: a host-architecture libudev-dev is still picked up
    # by libcec's cmake probe, but then the target link fails with
    # "cannot find -ludev". If libudev-dev is not published for the target
    # architecture (e.g. armel), libcec is built without device detection instead.
    "dpkg --add-architecture $CROSS_DEB_ARCH || :",
    "apt-get update && apt-get install --assume-yes libudev-dev:$CROSS_DEB_ARCH || echo \"Could not install libudev-dev:$CROSS_DEB_ARCH. Libcec device detection will be unavailable\""
]
