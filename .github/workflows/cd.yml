name: Continuous Deployment

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  LIBCEC_VERSION: 8.1.6
  # Tag of the prebuilt libCEC release to fetch. The libcec crate links
  # dynamically (dylib=cec) with no static option, so this bundles libcec.so.
  LIBCEC_RELEASE_TAG: libcec-v8.1.6-202608-2

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            architecture: armv7
            deb_arch: armhf
          - target: aarch64-unknown-linux-gnu
            architecture: arm64
            deb_arch: arm64
    container:
      image: ghcr.io/cross-rs/${{ matrix.target }}:main
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Fetch matching libCEC 8 shared library
        run: |
          dpkg --add-architecture "${{ matrix.deb_arch }}"
          apt-get update
          apt-get install --yes unzip "libudev-dev:${{ matrix.deb_arch }}"
          mkdir -p libcec
          curl --fail --location --retry 3 \
            --output libcec/libcec.zip \
            "https://github.com/ssalonen/libcec-static-builds/releases/download/${LIBCEC_RELEASE_TAG}/libcec-v${LIBCEC_VERSION}-dynamic-${{ matrix.target }}-release.zip"
          unzip -q libcec/libcec.zip -d libcec/unpacked
          find libcec/unpacked -type f -name libcec.so -printf 'LIBCEC_LIB_DIR=%h\n' >> "$GITHUB_ENV"
      - name: Build release binary
        run: |
          RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN/lib' \
            cargo build --release --target "${{ matrix.target }}" --verbose
      - name: Package binary and matching libCEC runtime
        run: |
          release_name="cec-alsa-sync-${GITHUB_REF_NAME}-linux-${{ matrix.architecture }}"
          bundle="$release_name"
          mkdir -p "$bundle/lib"
          cp "target/${{ matrix.target }}/release/cec-alsa-sync" "$bundle/"
          cp "$LIBCEC_LIB_DIR"/libcec.so* "$bundle/lib/"
          cp LICENSE "$bundle/"
          tar -C . -czvf "$release_name.tar.gz" "$bundle"
          sha256sum "$release_name.tar.gz" > "$release_name.tar.gz.sha256"
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cec-alsa-sync-*.tar.gz
            cec-alsa-sync-*.tar.gz.sha256
